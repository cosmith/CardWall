name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;37.0.0"
      - name: Set build version
        id: version
        shell: bash
        run: |
          version="0.1.3-main.${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "tag=main-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Test, lint and build release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_CODE: ${{ steps.version.outputs.code }}
        run: >-
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
          -PcardwallVersionCode="$RELEASE_CODE"
          -PcardwallVersionName="$RELEASE_VERSION"
      - name: Sign and verify APK
        env:
          CARDWALL_KEYSTORE_BASE64: ${{ secrets.CARDWALL_KEYSTORE_BASE64 }}
          CARDWALL_KEYSTORE_PASSWORD: ${{ secrets.CARDWALL_KEYSTORE_PASSWORD }}
          CARDWALL_KEY_ALIAS: ${{ secrets.CARDWALL_KEY_ALIAS }}
          CARDWALL_KEY_PASSWORD: ${{ secrets.CARDWALL_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          for name in CARDWALL_KEYSTORE_BASE64 CARDWALL_KEYSTORE_PASSWORD CARDWALL_KEY_ALIAS CARDWALL_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret $name. See docs/RELEASING.md. No unsigned APK will be published."
              exit 1
            fi
          done
          umask 077
          keystore="$RUNNER_TEMP/cardwall-release.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$CARDWALL_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          mkdir -p dist
          apk="dist/CardWall-${RELEASE_VERSION}-${GITHUB_SHA:0:7}.apk"
          build_tools="$ANDROID_HOME/build-tools/37.0.0"
          "$build_tools/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/cardwall-aligned.apk"
          "$build_tools/apksigner" sign --ks "$keystore" \
            --ks-key-alias "$CARDWALL_KEY_ALIAS" \
            --ks-pass env:CARDWALL_KEYSTORE_PASSWORD \
            --key-pass env:CARDWALL_KEY_PASSWORD \
            --out "$apk" "$RUNNER_TEMP/cardwall-aligned.apk"
          "$build_tools/apksigner" verify --verbose "$apk"
          cd dist
          sha256sum ./*.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cardwall-release
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cardwall-release
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          cd dist
          sha256sum --check SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.apk SHA256SUMS.txt --clobber
          else
            printf 'Automated release from main.\n\nCommit: %s\nVersion: %s\n\nDownload the APK below to install or update CardWall.\n\nExperimental, purely vibe-coded software. Back up your Anki collection before use.\n' \
              "$GITHUB_SHA" "$RELEASE_VERSION" > "$RUNNER_TEMP/release-notes.md"
            gh release create "$RELEASE_TAG" ./*.apk SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "CardWall $RELEASE_VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

name: App screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/screenshots.yml'
      - 'app/src/androidTest/**'

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install build SDK
        run: sdkmanager "platforms;android-36" "build-tools;37.0.0"
      - name: Build screenshot test APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture the app UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            adb shell settings put system font_scale 1.0
            adb shell cmd uimode night no
            timeout 120 adb install --no-streaming -r -t app/build/outputs/apk/debug/app-debug.apk
            timeout 120 adb install --no-streaming -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            timeout 120 adb shell am instrument -w -e class fr.cosmith.cardwall.ScreenshotsTest fr.cosmith.cardwall.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/screenshot-tests.txt"
            grep -q 'OK (1 test)' "$RUNNER_TEMP/screenshot-tests.txt"
            mkdir -p screenshots
            adb pull /sdcard/Android/data/fr.cosmith.cardwall/files/screenshots/. screenshots/
      - uses: actions/upload-artifact@v4
        with:
          name: cardwall-screenshots
          path: screenshots/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshot-test-reports
          path: ${{ runner.temp }}/screenshot-tests.txt
